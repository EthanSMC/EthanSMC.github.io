    <rect x="73" y="52" width="190" height="48" rx="4" fill="#275ba8" transform="rotate(-2 168 76)"/>
    <text x="96" y="85" fill="#fbfaf6" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="800" letter-spacing="3">现场笔记</text>

