<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="ruled" width="1200" height="44" patternUnits="userSpaceOnUse">
      <path d="M0 43.5H1200" stroke="#275ba8" stroke-opacity=".09"/>
    </pattern>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="23" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faded"><feFuncA type="table" tableValues="0 .05"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="630"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" filter="url(#paper)">
    <rect width="1200" height="630" fill="#fbfaf6"/>
