<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#3a352d" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="18" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faded"><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="multiply"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="630" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" filter="url(#paper)">
    <rect width="1200" height="630" fill="#f4f2ec"/>
    <rect width="1200" height="630" fill="url(#grid)"/>
    <path d="M34 38C206 26 373 31 540 37M33 593c215 10 419 5 604-2" fill="none" stroke="#3a352d" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>
    <circle cx="986" cy="304" r="244" fill="#c8d8ee" fill-opacity=".58"/>
    <path d="M770 111c79-50 223-76 338-31M803 526c91 38 244 33 332-27" fill="none" stroke="#275ba8" stroke-opacity=".42" stroke-width="3" stroke-dasharray="8 13" stroke-linecap="round"/>

    <text x="68" y="82" fill="#275ba8" font-family="SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" letter-spacing="3">ETHANSMC / SHANGHAI</text>
    <g transform="rotate(-1 358 292)">
      <text x="64" y="250" fill="#1b1b18" font-family="Bradley Hand, Segoe Print, PingFang SC, sans-serif" font-size="112" font-weight="800">是 Ethan</text>
      <text x="64" y="374" fill="#1b1b18" font-family="Bradley Hand, Segoe Print, PingFang SC, sans-serif" font-size="102" font-weight="800">不是埃森</text>
      <path d="M274 391c107-9 219-7 332 3M280 400c106-3 216 2 324 7" fill="none" stroke="#bd564c" stroke-width="8" stroke-linecap="round"/>
    </g>

    <g transform="translate(68 438) rotate(-1)">
      <path d="M0 5 541 0l8 65L7 70Z" fill="#e7b936" fill-opacity=".9"/>
      <text x="20" y="46" fill="#1b1b18" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">金融科技产品经理 × AI Agent 构建者</text>
    </g>
    <text x="70" y="563" fill="#504b43" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23">做产品，也把还没有答案的问题写下来。</text>

    <image href="digital-ethan/digital-ethan-main-cutout.png" x="882" y="20" width="228" height="590" preserveAspectRatio="xMidYMid meet"/>
    <path d="M839 194c31-27 64-46 96-57" fill="none" stroke="#bd564c" stroke-width="4" stroke-linecap="round"/>
    <path d="m849 190-14 7 5-14" fill="none" stroke="#bd564c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="742" y="181" fill="#bd564c" font-family="Bradley Hand, Segoe Print, PingFang SC, sans-serif" font-size="30" font-weight="700" transform="rotate(-6 742 181)">本人 →</text>
  </g>
</svg>
